name: OpenCPU Cloud Build

on:
  push:
    branches:
      - main

jobs:
  trigger_build:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger OpenCPU Cloud Rebuild
        run: |
          curl -v -X POST "https://cloud.opencpu.org/ocpu/github/" \
            -d "url=https://github.com/${{ github.repository }}"
